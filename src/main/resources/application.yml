server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: rag-knowledge-base

  # 向量库由 VectorStoreConfig 手动构建，关掉自动配置避免出现两个 VectorStore Bean
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.redis.autoconfigure.RedisVectorStoreAutoConfiguration

  # 自动加载项目根目录的 .env（KEY=VALUE 格式），文件不存在也不影响启动
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/rag_kb_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        model: ${OLLAMA_CHAT_MODEL:qwen2.5:14b}
        temperature: ${OLLAMA_TEMPERATURE:0.2}
        num-ctx: ${OLLAMA_NUM_CTX:8192}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  level:
    com.example.rag: INFO

app:
  rag:
    # 向量召回的最低相似度，低于它的子块直接丢弃
    vector-threshold: ${RAG_VECTOR_THRESHOLD:0.6}
    # 认为"资料能回答这个问题"的最低相似度；达不到且关键词也没命中，就触发查询改写
    confident-score: ${RAG_CONFIDENT_SCORE:0.75}
    # 低置信时是否启用查询改写
    rewrite-enabled: ${RAG_REWRITE_ENABLED:true}
