server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: rag-knowledge-base

  # 自动加载项目根目录的 .env（KEY=VALUE 格式），文件不存在也不影响启动
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/rag_kb_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}
    encoding:
      charset: UTF-8
      force: true

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        model: ${OLLAMA_CHAT_MODEL:qwen2.5:14b}
        temperature: ${OLLAMA_TEMPERATURE:0.2}
        num-ctx: ${OLLAMA_NUM_CTX:8192}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  level:
    com.example.rag: INFO
